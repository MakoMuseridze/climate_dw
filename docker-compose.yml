# Global Climate Data Warehouse — local stack (ClickHouse + Grafana)
# Usage:  docker compose up -d   then   make bootstrap
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: climate_clickhouse
    ports:
      - "8123:8123"      # HTTP (clickhouse-connect / ETL)
      - "9000:9000"      # native (Grafana plugin)
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: climate
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./docker/clickhouse/users.d:/etc/clickhouse-server/users.d
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "climate", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  grafana:
    image: grafana/grafana:11.1.0
    container_name: climate_grafana
    ports:
      - "3000:3000"
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./dashboards/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./dashboards/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      clickhouse:
        condition: service_healthy

volumes:
  ch_data:
  grafana_data:
